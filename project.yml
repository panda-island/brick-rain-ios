name: BrickRain
options:
  bundleIdPrefix: com.brickrain
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 18
    MARKETING_VERSION: 1.14.0
targets:
  BrickRain:
    type: application
    platform: iOS
    sources:
      - path: BrickRain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandaisland.brickrain.v13
        PRODUCT_NAME: BrickRain
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brick Rain
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BrickRainTests
  BrickRainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrickRainTests
    dependencies:
      - target: BrickRain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
