name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile app and tests without booting Simulator
        run: |
          xcodebuild build-for-testing \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build device app
        run: |
          xcodebuild build \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BrickRain.app build/Payload/
          cd build
          zip -qry BrickRain-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrickRain-unsigned-ipa
          path: build/BrickRain-unsigned.ipa
          if-no-files-found: error
