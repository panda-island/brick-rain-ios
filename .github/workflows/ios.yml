name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile app and tests without booting Simulator
        run: |
          xcodebuild build-for-testing \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build device app
        run: |
          xcodebuild build \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify updated gameplay is inside the executable
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/BrickRain.app"
          EXECUTABLE="$APP_PATH/BrickRain"
          strings "$EXECUTABLE" | grep -F "Recall all balls"
          strings "$EXECUTABLE" | grep -F "laserCross"
          strings "$EXECUTABLE" | grep -F "triangleBrick"
          strings "$EXECUTABLE" | grep -F "brickRain.savedProgress.v6"
          strings "$EXECUTABLE" | grep -F "CLEAR BOTTOM 3 ROWS & CONTINUE"
          printf '{"version":"1.6.0","build":"7","commit":"%s","features":"round-strength-bricks,bottom-three-row-recovery,constant-speed-spring,sharp-square-bricks"}\n' "$GITHUB_SHA" > "$APP_PATH/BuildIdentity.json"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BrickRain.app build/Payload/
          cd build
          zip -qry BrickRain-1.6.0-7-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrickRain-1.6.0-7-unsigned-ipa
          path: build/BrickRain-1.6.0-7-unsigned.ipa
          if-no-files-found: error
