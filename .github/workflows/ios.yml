name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test on Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')
          xcodebuild test \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build device app
        run: |
          xcodebuild build \
            -project BrickRain.xcodeproj \
            -scheme BrickRain \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BrickRain.app build/Payload/
          cd build
          zip -qry BrickRain-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrickRain-unsigned-ipa
          path: build/BrickRain-unsigned.ipa
          if-no-files-found: error
